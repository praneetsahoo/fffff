# OpsIntel nginx: public port 80 → app on 127.0.0.1:8000 (the app port is never exposed).
user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /run/nginx.pid;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    keepalive_timeout 65;

    log_format main '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                    '$request_time "$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    gzip on;
    gzip_types text/css application/javascript application/json text/csv image/svg+xml;
    gzip_min_length 1024;
    gzip_proxied any;

    # Basic abuse protection: per-IP rate limits (uploads stricter than reads).
    limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=upload:10m rate=2r/s;

    upstream opsintel { server 127.0.0.1:8000; keepalive 16; }

    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        client_max_body_size 11m;   # app limit is 10 MB; app returns the friendly error
        client_body_timeout 60s;

        location = /api/uploads {
            limit_req zone=upload burst=5 nodelay;
            limit_req_status 429;
            proxy_pass http://opsintel;
            include /etc/nginx/opsintel_proxy.conf;
        }

        location /static/ {
            proxy_pass http://opsintel;
            include /etc/nginx/opsintel_proxy.conf;
            expires 5m;
        }

        location / {
            limit_req zone=api burst=40 nodelay;
            limit_req_status 429;
            proxy_pass http://opsintel;
            include /etc/nginx/opsintel_proxy.conf;
        }

        error_page 413 /too_large.json;
        location = /too_large.json {
            internal;
            default_type application/json;
            return 413 '{"error":{"code":"file_too_large","message":"The file is larger than the 10 MB limit.","details":{}}}';
        }

        error_page 502 503 504 /maintenance.json;
        location = /maintenance.json {
            internal;
            default_type application/json;
            return 503 '{"error":{"code":"service_unavailable","message":"OpsIntel is restarting. Please try again in a few seconds.","details":{}}}';
        }
    }
}
